[package]
name = "mail"
version = "0.1.0"
description = "Cangjie Mail - SMTP email sending library for Cangjie language"
cjc-version = "1.0.4"
output-type = "static"

[dependencies]

# openHiTLS FFI 配置
#
# 用户需要安装 openHiTLS 并设置以下环境变量：
#   export HITLS_LIB=/path/to/hitls/lib
#   export LD_LIBRARY_PATH=$HITLS_LIB:$LD_LIBRARY_PATH
#
# 默认查找 ~/.local/lib/hitls；可通过环境变量 HITLS_LIB 覆盖。
# 若 HiTLS 安装在系统标准路径 /usr/local/lib，删除下方 path 字段即可。
[ffi.c]
hitls_tls    = { path = "/home/chenchaotao/.local/lib/hitls" }
hitls_crypto = { path = "/home/chenchaotao/.local/lib/hitls" }
hitls_bsl    = { path = "/home/chenchaotao/.local/lib/hitls" }
hitls_pki    = { path = "/home/chenchaotao/.local/lib/hitls" }
hitls_auth   = { path = "/home/chenchaotao/.local/lib/hitls" }
boundscheck  = { path = "/home/chenchaotao/.local/lib/hitls" }
